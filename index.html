<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຮ່ວມງານກັບ SSMI — ສະໝັກງານຕາມສາຍງານ</title>
<meta name="description" content="ສກຈຮ ສິນຊັບເມືອງເໜືອ (SSMI) ເປີດຮັບສະໝັກພະນັກງານ ສຳຫຼວດແຕ່ລະຝ່າຍ ເບິ່ງພາລະໜ້າທີ່ ແລະ ສະໝັກຕຳແໜ່ງທີ່ເປີດຮັບໄດ້ທີ່ນີ້">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/png" href="SSMI LOGO FINAL3.png">
<link rel="apple-touch-icon" href="SSMI LOGO FINAL3.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', '"Noto Sans Lao"', '"Noto Sans Thai"', 'sans-serif'],
          body: ['"Inter"', '"Noto Sans Lao"', '"Noto Sans Thai"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', '"Noto Sans Lao"', 'monospace']
        },
        animation: {
          blob: 'blob 14s infinite'
        },
        keyframes: {
          blob: {
            '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
            '33%':      { transform: 'translate(30px, -40px) scale(1.1)' },
            '66%':      { transform: 'translate(-20px, 20px) scale(0.95)' }
          }
        }
      }
    }
  };
</script>
<!-- Small bridge rules: things Tailwind utility classes alone can't express because
     they must survive a runtime className overwrite (form status) or live inside a
     translated content string from app.js (the <em> required-marker and the
     <span class="grad"> inside the hero headline) — everything else on this page is
     plain Tailwind utility classes. -->
<style>
  [hidden]{ display: none !important; }
  .grad{ background-image: linear-gradient(90deg, #4f46e5, #a855f7, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  [data-lang-opt].is-active{ color: #4f46e5; font-weight: 800; }
  em{ font-style: normal; color: #4f46e5; }

  /* ໜ້າຈໍ "ກຳລັງສົ່ງ" ແລະ "ສົ່ງສຳເລັດ" */
  @keyframes ssmi-spin { to { transform: rotate(360deg); } }
  @keyframes ssmi-bar  { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  @keyframes ssmi-pop  { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes ssmi-draw { to { stroke-dashoffset: 0; } }
  @keyframes ssmi-ring { 0% { transform: scale(.8); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
  .ssmi-spinner{ animation: ssmi-spin 1s linear infinite; }
  .ssmi-bar{ animation: ssmi-bar 1.4s ease-in-out infinite; }
  .ssmi-pop{ animation: ssmi-pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
  .ssmi-ring{ animation: ssmi-ring 1.4s ease-out .2s infinite; }
  .ssmi-check{ stroke-dasharray: 48; stroke-dashoffset: 48; animation: ssmi-draw .5s ease-out .25s forwards; }
</style>
</head>
<body class="min-h-screen bg-slate-50 font-body text-slate-600 antialiased">

  <a href="#app" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[200] focus:rounded-xl focus:bg-indigo-600 focus:px-4 focus:py-2 focus:text-sm focus:font-bold focus:text-white focus:shadow-lg">ຂ້າມໄປຫາເນື້ອຫາ</a>

  <header class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/70 backdrop-blur-xl backdrop-saturate-150">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:h-20 sm:px-6">
      <a class="group flex min-w-0 items-center gap-2 sm:gap-3" href="#/">
        <!-- ວາງໄຟລ໌ໂລໂກ້ຂອງອົງກອນຊື່ logo.png ໄວ້ໃນໂຟນເດີດຽວກັນ
             ຖ້າບໍ່ມີໄຟລ໌ ລະບົບຈະສະແດງເຄື່ອງໝາຍ "SS" ແທນອັດຕະໂນມັດ -->
        <img src="SSMI LOGO FINAL3.png" alt="SSMI logo" class="h-8 w-auto rounded-xl object-contain transition-transform duration-300 group-hover:scale-105 sm:h-10"
             onerror="this.remove(); document.querySelector('.brand-mark').hidden = false;">
        <span class="brand-mark hidden h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-fuchsia-500 font-display text-xs font-bold text-white shadow-lg shadow-indigo-500/30 sm:h-10 sm:w-10 sm:text-sm" hidden>SS</span>
        <span class="truncate font-display text-sm font-bold tracking-tight text-slate-900 sm:text-base" data-i18n="brand">SSMI — ສິນຊັບເມືອງເໜືອ</span>
      </a>
      <nav class="flex items-center gap-2 sm:gap-4">
        <!-- ลิงก์เดิม -->
        <a href="#/" class="hidden text-sm font-semibold text-slate-600 transition-colors duration-200 hover:text-indigo-600 sm:block" data-i18n="navAll">ຝ່າຍທັງໝົດ</a>
        
        <!-- ลิงก์ใหม่ (ปุ่มสีม่วงเด่นๆ) -->
        <a href="#/openings" class="hidden rounded-full bg-indigo-50 px-3 py-1.5 text-sm font-bold text-indigo-600 transition-colors duration-200 hover:bg-indigo-100 hover:text-indigo-800 sm:block" data-i18n="navOpen">ຕຳແໜ່ງທີ່ເປີດຮັບ</a>
        
        <!-- ปุ่มเปลี่ยนภาษาเดิม -->
        <button type="button" class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold tracking-wide text-slate-600 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:border-indigo-300 hover:shadow-md sm:px-4 sm:py-2" id="lang-toggle" aria-label="Switch language">
          <span data-lang-opt="la">ລາວ</span><i class="not-italic text-slate-300">/</i><span data-lang-opt="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app">
    <!-- JS renders views here: directory grid OR department detail -->
  </main>

  <footer class="border-t border-slate-200 bg-white py-6 sm:py-8">
    <div class="mx-auto flex max-w-6xl flex-col items-center gap-2 px-4 text-center text-sm text-slate-500 sm:flex-row sm:justify-between sm:px-6 sm:text-left">
      <p>© <span id="year"></span> <span data-i18n="footerBrand">SSMI ສິນຊັບເມືອງເໜືອ</span></p>
      <p class="text-slate-400" data-i18n="footerNote">ຂໍ້ມູນຜູ້ສະໝັກຈະຖືກສົ່ງຕົງເຖິງຝ່າຍບຸກຄະລາກອນເພື່ອພິຈາລະນາ</p>
    </div>
  </footer>

  <!-- ================= ໜ້າຈໍລະຫວ່າງສົ່ງ / ສົ່ງສຳເລັດ ================= -->
  <div id="submit-overlay" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/80 p-6 backdrop-blur-md" hidden>
    <div class="ssmi-pop w-full max-w-sm rounded-3xl border border-white/60 bg-white p-8 text-center shadow-2xl shadow-indigo-500/30">

      <!-- ກຳລັງສົ່ງ -->
      <div id="submit-sending">
        <div class="relative mx-auto mb-6 h-20 w-20">
          <span class="ssmi-ring absolute inset-0 rounded-full bg-indigo-400/30"></span>
          <span class="ssmi-spinner absolute inset-0 rounded-full border-4 border-slate-200 border-t-indigo-600"></span>
          <span class="absolute inset-0 flex items-center justify-center text-2xl">📨</span>
        </div>
        <h3 class="font-display text-lg font-bold text-slate-900" id="submit-sending-title"></h3>
        <p class="mt-2 text-sm text-slate-500" id="submit-sending-sub"></p>
        <div class="mt-5 h-1.5 w-full overflow-hidden rounded-full bg-slate-100">
          <div class="ssmi-bar h-full w-1/3 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500"></div>
        </div>
      </div>

      <!-- ສົ່ງສຳເລັດ -->
      <div id="submit-done" hidden>
        <div class="ssmi-pop mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-50 ring-8 ring-emerald-100/70">
          <svg viewBox="0 0 52 52" class="h-12 w-12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="26" cy="26" r="23" stroke="#10b981" stroke-width="3" opacity=".25"/>
            <path class="ssmi-check" d="M15 27.5 L23 35 L38 19" stroke="#10b981" stroke-width="4.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3 class="font-display text-xl font-bold text-slate-900" id="submit-done-title"></h3>
        <p class="mt-3 text-base font-semibold text-indigo-600" id="submit-done-sub"></p>
        <p class="mt-2 text-xs text-slate-400" id="submit-done-note"></p>
        <button type="button" id="submit-done-btn"
          class="mt-6 w-full rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-500/30 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-xl"></button>
      </div>

    </div>
  </div>

  <!-- Application modals -->
  <div id="apply-overlay" class="fixed inset-0 z-[100] flex items-start justify-center overflow-y-auto overscroll-contain bg-slate-900/70 p-0 backdrop-blur-md sm:p-6 sm:py-10" hidden>
    <div class="relative my-0 min-h-screen w-full max-w-lg rounded-none border-0 border-white/60 bg-white p-6 shadow-2xl shadow-indigo-500/20 sm:my-auto sm:min-h-0 sm:max-w-2xl sm:rounded-3xl sm:border sm:p-8" role="dialog" aria-modal="true" aria-labelledby="apply-title">
      <button class="absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full text-slate-400 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-700" id="apply-close" aria-label="Close">✕</button>

      <div class="mb-6 pr-10">
        <p class="mb-1 font-mono text-xs font-bold uppercase tracking-widest text-indigo-600" id="apply-dept-label">ຝ່າຍ</p>
        <h2 class="font-display text-xl font-bold text-slate-900 sm:text-2xl" id="apply-title">ສະໝັກຕຳແໜ່ງ </h2>
      </div>

      <form id="apply-form" novalidate class="space-y-4">
        <input type="hidden" id="field-department">
        <input type="hidden" id="field-department-id">
        <input type="hidden" id="field-position">
        <input type="hidden" id="field-branch">
        <input type="hidden" id="field-branch-id">

        <!-- ຊ່ອງກອກທັງໝົດ (ລວມ ຊື່ / ອີເມວ / ເບີໂທລະສັບ) ຖືກສ້າງດ້ວຍ app.js
             ຕາມໂຄງສ້າງທີ່ຕັ້ງໄວ້ໃນ Firestore (settings/applicationForm)
             ຈັດການໄດ້ຈາກໜ້າ admin → ແທັບ "ຕັ້ງຄ່າ" ໂດຍບໍ່ຕ້ອງແກ້ໂຄດອີກຕໍ່ໄປ -->
        <!-- ແຈ້ງເຕືອນເມື່ອກູ້ຂໍ້ມູນທີ່ຄ້າງໄວ້ຄືນມາ -->
        <div id="draft-note" class="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-semibold text-amber-700" hidden>
          <span id="draft-note-text"></span>
          <button type="button" id="draft-clear" class="shrink-0 rounded-full border border-amber-300 bg-white px-3 py-1 text-xs font-bold text-amber-700 transition-colors hover:bg-amber-100"></button>
        </div>

        <!-- ຫົວຂໍ້ຂັ້ນຕອນ (ສະແດງເມື່ອຟອມຖືກແບ່ງເປັນຫຼາຍໜ້າ) -->
        <div id="form-steps" class="mb-1 space-y-2" hidden></div>

        <div id="custom-fields"></div>

        <p class="text-xs text-slate-400" data-i18n="formNote">ເມື່ອກົດສົ່ງ ຂໍ້ມູນຂອງທ່ານຈະຖືກບັນທຶກເຂົ້າລະບົບ ແລະ ແຈ້ງເຕືອນຝ່າຍບຸກຄະລາກອນໂດຍອັດຕະໂນມັດ</p>

        <div class="flex flex-wrap items-center gap-3 pt-1">
          <button type="button" class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-600 transition-all duration-300 hover:-translate-y-0.5 hover:border-indigo-300 hover:text-indigo-600" id="apply-prev" hidden>← ກັບຄືນ</button>
          <button type="button" class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-500/30 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-indigo-500/40" id="apply-next" hidden>ຖັດໄປ →</button>
          <button type="submit" class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-500/30 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-indigo-500/40 active:translate-y-0 disabled:cursor-not-allowed disabled:opacity-50" id="apply-submit" data-i18n="submit">ສົ່ງໃບສະໝັກ</button>
          <span class="text-sm font-semibold text-slate-500" id="apply-status" role="status"></span>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
